<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML to FastAPI demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; }
    fieldset { margin-bottom: 24px; padding: 14px; }
    label { display: block; margin: 8px 0 2px; }
    input, button { padding: 6px; font-size: 15px; }
    pre { background: #f3f4f6; padding: 10px; }
  </style>
</head>
<body>
  <h1>HTML to FastAPI</h1>

  <!-- Jinja2: shows only when FastAPI passes a "result" value -->
  {% if result %}
    <p style="background:#e6f4ea; padding:10px;"><b>{{ result }}</b></p>
  {% endif %}

  <!-- 1) GET form: values go into the URL -->
  <fieldset>
    <legend>1. GET form</legend>
    <form action="/greet" method="get">
      <label for="g-name">Name</label>
      <input id="g-name" name="name" required>
      <label for="g-age">Age</label>
      <input id="g-age" name="age" type="number" required>
      <p><button type="submit">Send with GET</button></p>
    </form>
  </fieldset>

  <!-- 2) POST form: values go inside the request body -->
  <fieldset>
    <legend>2. POST form</legend>
    <form action="/register" method="post">
      <label for="p-name">Name</label>
      <input id="p-name" name="name" required>
      <label for="p-email">Email</label>
      <input id="p-email" name="email" type="email" required>
      <label for="p-age">Age</label>
      <input id="p-age" name="age" type="number" required>
      <p><button type="submit">Send with POST</button></p>
    </form>
  </fieldset>

  <!-- 3) POST JSON with JavaScript: page does not reload -->
  <fieldset>
    <legend>3. POST JSON (fetch)</legend>
    <form id="json-form">
      <label for="j-name">Name</label>
      <input id="j-name" name="name" required>
      <label for="j-course">Course</label>
      <input id="j-course" name="course" required>
      <p><button type="submit">Send JSON</button></p>
    </form>
    <pre id="result">Response will appear here</pre>
  </fieldset>

  <script>
    document.getElementById("json-form").addEventListener("submit", async (e) => {
      e.preventDefault();                       // stop the normal page reload
      const data = Object.fromEntries(new FormData(e.target));   // {name:..., course:...}
      const res = await fetch("/api/student", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      document.getElementById("result").textContent =
        JSON.stringify(await res.json(), null, 2);
    });
  </script>
</body>
</html>
